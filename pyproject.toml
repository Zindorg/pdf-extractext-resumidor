[project]
name = "pdf-extractext-resumidor"
version = "0.1.0"
description = "Worker asíncrono de resumen de texto con Map-Reduce y Clean Architecture"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Zinik Facundo" },
    { name = "Velez Marcos" },
    { name = "Gonzalez Ignacio Matias" },
    { name = "Monardi Dalma" },
]

dependencies = [
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "redis>=6.0.0",
    "httpx>=0.28.1",
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
